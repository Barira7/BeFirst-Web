<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — BeFirst SEO</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECE5D6">
<link rel="icon" href="BF_Logo_Reference.svg">
<script>window.BEFIRST_API='https://befirst-backend.onrender.com';</script>
<script src="auth.js"></script>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<style>
body{background:#ECE5D6;color:#222;font-family:Georgia,'Times New Roman',serif;line-height:1.7;margin:0;padding:0}
nav{position:sticky;top:0;z-index:50;background:rgba(236,229,214,.72);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.55)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:62px;max-width:1060px;margin:0 auto;padding:0 24px}
.nav-links{display:flex;gap:20px;align-items:center;font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif}
.nav-links a{color:#555;text-decoration:none;font-size:15px}
.nav-links button{background:none;border:none;color:#555;font-size:15px;cursor:pointer;font-family:inherit}
.brand{font-size:26px;font-weight:800;text-decoration:none;color:#222;display:flex;align-items:center;gap:5px}
.brand-logo{width:44px;height:48px;object-fit:cover;mix-blend-mode:multiply}
.brand-name{font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif;font-size:25px;font-weight:900;color:#222}
.brand-name strong{color:#B4552D}
.btn{display:inline-block;background:#222;color:#ECE5D6;border:none;border-radius:10px;padding:9px 20px;font-size:15px;cursor:pointer;text-decoration:none;font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif}
.btn:hover{background:#000}
.btn.accent{background:#B4552D}
.btn.accent:hover{background:#97431f}
.wrap{max-width:960px;margin:0 auto;padding:40px 24px 72px}
h1{font-size:32px;margin-bottom:4px}
.hello{color:#555;margin-bottom:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.card{background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:28px}
.card h2{font-size:20px;margin:0 0 10px}
.plan-name{font-size:40px;font-weight:bold;text-transform:capitalize}
.plan-name small{font-size:15px;font-weight:normal;color:#555}
.card p{font-size:15px;color:#555;font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif}
.upg{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px;font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif}
th{text-align:left;padding:10px 8px;border-bottom:2px solid #D8CCB4;color:#555}
td{padding:10px 8px;border-bottom:1px dashed #D8CCB4}
td.url{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{display:inline-block;min-width:44px;text-align:center;border-radius:8px;padding:2px 8px;background:#222;color:#ECE5D6;font-weight:bold}
.empty{color:#555;text-align:center;padding:28px 0}
.msg{font-size:14px;margin-top:10px;min-height:20px;font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif}
.msg.err{color:#a33}
footer{border-top:1px solid #D8CCB4;padding:34px 0;text-align:center;color:#555;font-size:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="nav-in">
<a class="brand" href="/"><img class="brand-logo" src="BF_Logo_Reference.svg" alt="BeFirst SEO logo" /><span class="brand-name">Be<strong>First</strong></span></a>
<div class="nav-links"><a href="/app">Run audit</a><a href="/pricing">Pricing</a><button onclick="BeFirst.logout()">Log out</button></div></div></nav>
<div class="wrap">
<h1>Dashboard</h1>
<p class="hello" id="hello">Loading…</p>
<div class="grid">
<div class="card">
<h2>Your plan</h2>
<div class="plan-name" id="plan">…</div>
<p id="plandesc"></p>
<div class="upg" id="upg"></div>
<p class="msg" id="paymsg"></p>
</div>
<div class="card">
<h2>Audits run</h2>
<div class="plan-name" id="count">…</div>
<p>Every audit you run while logged in is saved here.</p>
<a class="btn" href="/app">+ New audit</a>
</div>
</div>
<div class="card">
<h2>Audit history</h2>
<div id="hist"><p class="empty">Loading…</p></div>
</div>
</div>
<footer>© 2026 BeFirst SEO · <a href="/">Home</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
<script>
/* Regional pricing: visitors outside India see USD */
window.BEFIRST_CUR={code:"INR"};
(function(){fetch("https://ipapi.co/country/").then(function(r){return r.text();}).then(function(c){
if(c&&c.trim().toUpperCase()!=="IN"){window.BEFIRST_CUR={code:"USD"};
document.querySelectorAll(".pr").forEach(function(el){var u=el.getAttribute("data-usd");if(u)el.textContent=u;});
if(typeof window.__recur==="function"){window.__recur();}}
}).catch(function(){});})();
</script>
<script>
if (!BeFirst.getToken()) location.href = "/login";
var userEmail = "";
function pc(inr,usd){return (window.BEFIRST_CUR&&window.BEFIRST_CUR.code==="USD")?usd:inr;}
var _plan="free";
function renderPlan(){var p=_plan;
  document.getElementById("plan").innerHTML = p + " <small>" + (p === "free" ? pc("₹0","$0") : p === "starter" ? pc("₹99/mo","$5/mo") : pc("₹799/mo","$15/mo")) + "</small>";
  document.getElementById("plandesc").textContent = p === "free" ? "Single-page audits. Upgrade for rank tracking, crawls and AI writer." : p === "starter" ? "Rank checks, brand check, generators and link leads unlocked." : "Everything unlocked: crawls, compare, AI writer, tracking.";
  var upg = document.getElementById("upg");
  if (p === "free") upg.innerHTML = '<button class="btn accent" onclick="upgrade(\'starter\')">Get Starter ' + pc("₹99/mo","$5/mo") + '</button> <button class="btn" onclick="upgrade(\'pro\')">Get Pro ' + pc("₹799/mo","$15/mo") + '</button>';
  else if (p === "starter") upg.innerHTML = '<button class="btn accent" onclick="upgrade(\'pro\')">Upgrade to Pro ' + pc("₹799/mo","$15/mo") + '</button>';
  else upg.innerHTML = '<span style="color:#2F7D4F">You have everything. Thank you!</span>';
}
window.__recur=function(){renderPlan();};
BeFirst.api("/me").then(function (j) {
  if (!j.ok) { BeFirst.clearToken(); location.href = "/login"; return; }
  userEmail = j.email;
  document.getElementById("hello").textContent = "Signed in as " + j.email;
  _plan = (j.plan || "free").toLowerCase();
  renderPlan();
  document.getElementById("count").textContent = j.audits_count;
}).catch(function () {
  document.getElementById("hello").textContent = "Server waking up (takes ~50 sec on free tier) — refresh in a minute.";
});
BeFirst.api("/my-audits").then(function (j) {
  var box = document.getElementById("hist");
  if (!j.ok || !j.audits || !j.audits.length) { box.innerHTML = '<p class="empty">No audits yet. <a href="/app">Run your first audit →</a></p>'; return; }
  var h = "<table><tr><th>Date</th><th>URL</th><th>Score</th></tr>";
  j.audits.forEach(function (a) {
    h += "<tr><td>" + a.date + '</td><td class="url"><a href="' + a.url + '" target="_blank" rel="noopener">' + a.url + '</a></td><td><span class="score">' + a.score + "</span></td></tr>";
  });
  box.innerHTML = h + "</table>";
}).catch(function () {});
var _up = new URLSearchParams(location.search).get("upgrade");
if (new URLSearchParams(location.search).get("paid") === "1") { history.replaceState({}, "", "/dashboard"); setTimeout(function () { document.getElementById("paymsg").textContent = "Payment received — your plan upgrades within a minute. Refresh the page."; }, 1500); }
if (_up === "starter" || _up === "pro") { history.replaceState({}, "", "/dashboard"); setTimeout(function () { upgrade(_up); }, 1500); }
function upgrade(plan) {  var m = document.getElementById("paymsg");
  m.className = "msg"; m.textContent = "Contacting payment server…";
  BeFirst.api("/create-order", { method: "POST", body: JSON.stringify({ plan: plan, currency: (window.BEFIRST_CUR && window.BEFIRST_CUR.code) || "INR" }) }).then(function (j) {
    if (!j.ok && j.need_setup) { m.className = "msg err"; m.textContent = "Online payments go live soon — email us via LinkedIn and we will upgrade you manually."; return; }
    if (!j.ok) { m.className = "msg err"; m.textContent = j.error || "Payment failed, try again."; return; }
    try {
      var cf = Cashfree({ mode: j.mode === "production" ? "production" : "sandbox" });
      cf.checkout({ paymentSessionId: j.payment_session_id, redirectTarget: "_self" });
    } catch (e) { m.className = "msg err"; m.textContent = "Could not open payment page. Try again."; }
  }).catch(function () { m.className = "msg err"; m.textContent = "Could not reach payment server. Try again in a minute."; });
}
</script>
</body>
</html>
