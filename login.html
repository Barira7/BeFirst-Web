<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — BeFirst SEO</title>
<meta name="description" content="Log in to your BeFirst SEO account.">
<link rel="canonical" href="https://befirstseo.pages.dev/login">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ECE5D6">
<link rel="icon" href="BF_Logo_Reference.svg">
<script>window.BEFIRST_API='https://befirst-backend.onrender.com';</script>
<script src="auth.js"></script>
<style>
body{background:#ECE5D6;color:#222;font-family:Georgia,'Times New Roman',serif;line-height:1.7;margin:0;padding:0}
nav{position:sticky;top:0;z-index:50;background:rgba(236,229,214,.72);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.55)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:62px;max-width:1060px;margin:0 auto;padding:0 24px}
.nav-links{display:flex;gap:26px;align-items:center;font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif}
.nav-links a{color:#555;text-decoration:none;font-size:15px}
.brand{font-size:26px;font-weight:800;text-decoration:none;color:#222;display:flex;align-items:center;gap:5px}
.brand-logo{width:44px;height:48px;object-fit:cover;mix-blend-mode:multiply}
.brand-name{font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif;font-size:25px;font-weight:900;color:#222}
.brand-name strong{color:#B4552D}
.btn{display:inline-block;background:#222;color:#ECE5D6;border:none;border-radius:10px;padding:9px 20px;font-size:15px;cursor:pointer;text-decoration:none;font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif}
.btn:hover{background:#000}
.btn.accent{background:#B4552D}
.btn.accent:hover{background:#97431f}
.wrap{max-width:440px;margin:0 auto;padding:64px 24px 72px}
.card{background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:36px 30px}
h1{font-size:32px;margin:0 0 6px;text-align:center}
.sub{text-align:center;color:#555;font-size:16px;margin-bottom:26px}
label{display:block;font-size:14px;margin:14px 0 4px;font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif}
input{width:100%;box-sizing:border-box;border:1px solid #D8CCB4;border-radius:10px;padding:11px 14px;font-size:16px;background:#fff}
input:focus{outline:2px solid #B4552D;border-color:#B4552D}
.btn.full{width:100%;margin-top:22px;padding:13px;font-size:16px}
.msg{min-height:24px;text-align:center;font-size:14px;margin-top:12px;font-family:-apple-system,'Segoe UI',Inter,Roboto,sans-serif}
.msg.err{color:#a33}
.switch{text-align:center;margin-top:18px;font-size:15px;color:#555}
.switch a{color:#B4552D}
footer{border-top:1px solid #D8CCB4;padding:34px 0;text-align:center;color:#555;font-size:14px}
</style>
</head>
<body>
<nav><div class="nav-in">
<a class="brand" href="/"><img class="brand-logo" src="BF_Logo_Reference.svg" alt="BeFirst SEO logo" /><span class="brand-name">Be<strong>First</strong></span></a>
<div class="nav-links"><a href="/">Home</a><a href="/pricing">Pricing</a><a href="/signup">Sign up</a></div></div></nav>
<div class="wrap"><div class="card">
<h1>Welcome back</h1>
<p class="sub">Log in to your dashboard.</p>
<form id="f">
<label for="email">Email</label>
<input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
<label for="pw">Password</label>
<input id="pw" type="password" required autocomplete="current-password" placeholder="••••••••">
<button class="btn accent full" type="submit">Log in</button>
</form>
<p class="msg" id="msg"></p>
<p class="switch">New here? <a href="/signup">Create free account</a></p>
</div></div>
<footer>© 2026 BeFirst SEO · <a href="/">Home</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
<script>
if (BeFirst.getToken()) location.href = "/dashboard";
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var msg = document.getElementById("msg");
  msg.className = "msg"; msg.textContent = "Logging in…";
  BeFirst.api("/login", { method: "POST", body: JSON.stringify({
    email: document.getElementById("email").value,
    password: document.getElementById("pw").value }) })
  .then(function (j) {
    if (j.ok) { BeFirst.setToken(j.token); location.href = "/dashboard"; }
    else { msg.className = "msg err"; msg.textContent = "Wrong email or password."; }
  })
  .catch(function () { msg.className = "msg err"; msg.textContent = "Server waking up (takes ~50 sec on free tier) — try again in a minute."; });
});
</script>
</body>
</html>
